spring.application.name=smartshop

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/smartshop_dev?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true

# JWT (must be provided via environment variable JWT_SECRET, >= 32 bytes for HS256)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# CORS (explicit origins only, no wildcard with credentials)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}