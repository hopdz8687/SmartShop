spring.application.name=smartshop

# Database (same local dev datasource as main, tests run with @Transactional rollback)
spring.datasource.url=jdbc:mysql://localhost:3306/smartshop_dev?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true

# Test-only JWT secret (>= 32 bytes for HS256). Never use in production.
app.jwt.secret=SmartShopTestOnlyJwtSecretKeyForHS256AtLeast32BytesLong!
app.jwt.expiration-ms=3600000
app.cors.allowed-origins=http://localhost:5173
